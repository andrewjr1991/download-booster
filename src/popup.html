<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img src="../icons/icon32.png" alt="" width="22" height="22" />
      <span class="brand" data-i18n="extShortName"></span>
      <span id="total" class="hint"></span>
      <button id="open-manager" class="icon" data-i18n-title="openManager"></button>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-view="media" aria-selected="true"><span data-i18n="popupMedia"></span> <b class="count" id="media-count"></b></button>
      <button role="tab" data-view="tasks" aria-selected="false"><span data-i18n="popupTasks"></span> <b class="count" id="tasks-count"></b></button>
    </nav>

    <section id="view-media" class="view">
      <div id="record" class="record" hidden>
        <div class="rec-head">
          <span class="rec-icon"></span>
          <div class="info">
            <span class="name" id="rec-title"></span>
            <span class="sub" id="rec-sub"></span>
          </div>
        </div>
        <p class="hint" id="rec-hint"></p>
        <div class="rec-foot">
          <label id="rec-fast-label"><input type="checkbox" id="rec-fast" checked /> <span data-i18n="recordFast"></span></label>
          <button id="rec-go" class="primary"></button>
        </div>
      </div>
      <div id="kinds" class="chips"></div>
      <ul id="media-list" class="list"></ul>
      <div id="media-empty" class="empty" hidden>
        <p data-i18n="mediaEmpty"></p>
      </div>
      <div class="bulk" id="media-bulk">
        <label><input type="checkbox" id="media-all" /> <span data-i18n="selectAll"></span></label>
        <button id="media-copy" class="icon" data-i18n-title="copyLinks" disabled></button>
        <button id="media-go" class="primary" disabled></button>
      </div>
    </section>

    <section id="view-tasks" class="view" hidden>
      <ul id="task-list" class="list"></ul>
      <div id="tasks-empty" class="empty" hidden><p data-i18n="tasksEmpty"></p></div>
    </section>

    <footer class="foot">
      <button id="sniff-links" class="ghost"></button>
      <span id="toast" class="hint" role="status"></span>
    </footer>

    <div id="preview" hidden>
      <div class="pv-head">
        <button id="pv-prev" class="icon" data-i18n-title="previous"></button>
        <span id="pv-name" class="pv-name"></span>
        <button id="pv-next" class="icon" data-i18n-title="next"></button>
        <button id="pv-close" class="icon" data-i18n-title="close"></button>
      </div>
      <div id="pv-stage" class="pv-stage"></div>
      <p id="pv-info" class="hint pv-info"></p>
      <div class="pv-foot">
        <button id="pv-select" class="ghost"></button>
        <button id="pv-download" class="primary"></button>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
